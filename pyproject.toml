[project]
name = "see-what-i-say"
version = "0.1.0"
description = "STARK VISION: Real-Time Speech-Guided Referring Video Segmentation"
readme = "README.md"
authors = [
    { name = "Hamza HATTAB", email = "hhamzariadh@gmail.com" },
]
requires-python = ">=3.11"

# Core: enough to run the mock pipeline, parser, effects, HUD and the CPU unit tests.
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pillow>=10.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
speech = [
    "openai-whisper>=20250625",
    "sounddevice>=0.5",
    "scipy>=1.13",
    "keyboard>=0.13.5",
]
vision = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stark_vision.hud" = ["assets/fonts/*.ttf"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27",   # needed by fastapi TestClient in tests/unit/test_server_api.py
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
