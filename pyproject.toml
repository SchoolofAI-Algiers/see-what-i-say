[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stark-vision"
version = "0.1.0"
description = "STARK VISION: real-time speech-guided referring video segmentation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.24.4,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Keep CPU-only mock and application development lightweight. The `full-demo`
# extra is intended for Linux x86_64 machines with an NVIDIA GPU.
speech = [
    "openai-whisper>=20240930",
    "scipy>=1.11,<2",
    "sounddevice>=0.4.6,<1",
]
vision = [
    "SAM-2>=1.0",
    "opencv-python>=4.10,<5",
    "Pillow>=9.4,<13",
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "huggingface-hub>=0.30,<1",
    "transformers>=4.51,<5",
]
full-demo = [
    "openai-whisper>=20240930",
    "scipy>=1.11,<2",
    "sounddevice>=0.4.6,<1",
    "SAM-2>=1.0",
    "opencv-python>=4.10,<5",
    "Pillow>=9.4,<13",
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "huggingface-hub>=0.30,<1",
    "transformers>=4.51,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stark_vision.hud" = ["assets/fonts/*.ttf"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", extra = "full-demo" },
    { index = "pytorch-cu121", extra = "vision" },
]
torchvision = [
    { index = "pytorch-cu121", extra = "full-demo" },
    { index = "pytorch-cu121", extra = "vision" },
]
sam-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
