[project]
name = "see-what-i-say"
version = "0.1.0"
description = "STARK VISION: Real-Time Speech-Guided Referring Video Segmentation"
readme = "README.md"
authors = [
    { name = "Hamza HATTAB", email = "hhamzariadh@gmail.com" },
]
requires-python = ">=3.11"

# sam 2 should be installed sperately
dependencies = [
    # speech
    "openai-whisper>=20250625",
    "sounddevice>=0.5.6",
    "keyboard>=0.13.5",
    "scipy>=1.17.1",
    # vision / models
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "opencv-python>=4.10",
    "numpy>=2.4.6",
    "pillow>=12.0.0",
    # config / validation
    "pyyaml>=6.0.0",
    "pydantic>=2.10.0",
    # API server (frontend backend + tests/unit/test_server_api.py)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

# Compatibility aliases: commands like `uv sync --extra vision --extra speech --extra api` keep working.
# Everything is already in the default dependencies above, so these are intentionally empty.
[project.optional-dependencies]
speech = []
vision = []
api = []

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stark_vision.hud" = ["assets/fonts/*.ttf"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "httpx>=0.27",  # fastapi TestClient
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]