[project]
name = "see-what-i-say"
version = "0.1.0"
description = "STARK VISION: Real-Time Speech-Guided Referring Video Segmentation"
readme = "README.md"
authors = [
    { name = "Hamza HATTAB", email = "hhamzariadh@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    # speech
    "openai-whisper>=20250625",
    "sounddevice>=0.5.6",
    "webcolors>=25.10.0",
    "keyboard>=0.13.5",
    "scipy>=1.17.1",
    "ffmpeg>=1.4",
    # vision / models
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "opencv-python>=5.0.0.93",
    "numpy>=2.4.6",
    "pillow>=12.0.0",
    # config / validation
    "pyyaml>=6.0.0",
    "pydantic>=2.10.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]